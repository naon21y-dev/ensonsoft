spring:
  application:
    name: project

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/logic}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8
    cache: false

server:
  port: ${PORT:8081}

jwt:
  secret: ${JWT_SECRET}
  expiration: 315360000000