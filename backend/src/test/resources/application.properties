# Tests must never connect to the developer's or Render's PostgreSQL database.
spring.datasource.url=${TEST_DATABASE_URL:jdbc:postgresql://127.0.0.1:55439/postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${TEST_DATABASE_USERNAME:postgres}
spring.datasource.password=${TEST_DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
jwt.secret=isolated-test-signing-key-not-for-production-0123456789abcdef
jwt.expiration=3600000
demo.seed.enabled=false
